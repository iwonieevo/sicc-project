services:
  frontend:
    build:
      context: ./frontend
      target: prod
      secrets:
        - frontend_env
    ports:
      - "${FRONTEND_EXPOSED_PORT}:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - public

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    ports:
      - "${BACKEND_EXPOSED_PORT}:8000"
    volumes:
      - type: bind
        source: ./db/certs
        target: /run/secrets/db-certs
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - env/.env.backend
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_USER=backend
      - DB_BACKEND_PASSWORD=${DB_BACKEND_PASSWORD}
      - DB_SSLMODE=verify-full
      - DB_SSLROOTCERT=/run/secrets/db-certs/ca.crt
      - SICC_VALKEY_URL=redis://:${VALKEY_PASSWORD}@valkey:6379/0
      - IOT_SERVER_URL=http://iot-server:7000
      - SECURE_MODE=true
    depends_on:
      db:
        condition: service_healthy
      iot-server:
        condition: service_started
    networks:
      - public
      - internal

  valkey:
    image: valkey/valkey:9.1.0
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    networks:
      - internal

  iot-server:
    build:
      context: .
      dockerfile: server-iot/Dockerfile
      target: prod
    volumes:
      - type: bind
        source: ./db/certs
        target: /run/secrets/db-certs
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - env/.env.server-iot
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_USER=iot_server
      - DB_IOT_PASSWORD=${DB_IOT_PASSWORD}
      - DB_SSLMODE=verify-full
      - DB_SSLROOTCERT=/run/secrets/db-certs/ca.crt
      - SICC_VALKEY_URL=redis://:${VALKEY_PASSWORD}@valkey:6379/0
      - SECURE_MODE=true
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - internal
      - agent-net

  db:
    build: ./db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./db/certs
        target: /run/secrets/postgres-tls
        read_only: true
        bind:
          create_host_path: false
      - ./db/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_BACKEND_PASSWORD=${DB_BACKEND_PASSWORD}
      - DB_IOT_PASSWORD=${DB_IOT_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  public:
  internal:
  agent-net:
    name: ${AGENT_NET_NAME}

volumes:
  postgres_data:
  valkey_data:

secrets:
  frontend_env:
    file: env/.env.frontend
