services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_EXPOSED_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - public

  backend:
    build: ./backend
    ports:
      - "${BACKEND_EXPOSED_PORT}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
      - env/.env.backend
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DB_USER=backend
      - IOT_SERVER_URL=http://iot-server:7000
    depends_on:
      db:
        condition: service_healthy
      iot-server:
        condition: service_started
    networks:
      - public
      - internal

  iot-server:
    build: ./server-iot
    ports:
      - "${IOT_SERVER_EXPOSED_PORT}:7000"
    volumes:
      - ./server-iot:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DB_USER=iot_server
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - agent-net

  db:
    build: ./db
    ports:
      - "${POSTGRES_EXPOSED_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  public:
  internal:
  agent-net:
    name: ${AGENT_NET_NAME}

volumes:
  postgres_data: