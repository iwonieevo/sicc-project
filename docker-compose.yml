services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=development
      - IOT_SERVER_URL=http://iot-server:7000
  iot-server:
    build: ./ServerIoT
    ports:
      - "7000:7000"
    volumes:
      - ./ServerIoT:/app
    environment:
      - ENV=development
      - BACKEND_URL=http://backend:8000
      - AGENT_URL=http://agent:9000
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - ENV=development
      - CHOKIDAR_USEPOLLING=true