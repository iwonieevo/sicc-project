networks:
  agent-net:
    external: true
    name: ${AGENT_NET_NAME}

services:
  agent:
    build:
      context: .
      dockerfile: agents/Dockerfile
    image: sicc-agent:latest
    container_name: ${AGENT_NAME}
    env_file:
      - .env
      - env/.env.agent
    environment:
      - IOT_SERVER_URL=http://iot-server:7000
      - AGENT_NAME=${AGENT_NAME}
      - SICC_SERVICE_IDENTITY=${SICC_SERVICE_IDENTITY:-}
      - SICC_SERVICE_KEY_ID=${SICC_SERVICE_KEY_ID:-}
      - SICC_SERVICE_PRIVATE_KEY_B64=${SICC_SERVICE_PRIVATE_KEY_B64:-}
      - SICC_TRUSTED_PUBLIC_KEYS_JSON=${SICC_TRUSTED_PUBLIC_KEYS_JSON:-{}}
      - SICC_IOT_SERVER_IDENTITY=${SICC_IOT_SERVER_IDENTITY:-iot-server}
      - SICC_IOT_SERVER_KEY_ID=${SICC_IOT_SERVER_KEY_ID:-}
      - SICC_MAX_SKEW_MS=${SICC_MAX_SKEW_MS:-30000}
    volumes:
      - ./security:/app/security:ro
    networks:
      - agent-net
    restart: unless-stopped
    labels:
      - ${AGENT_LABEL}
